name: Build SEC Company Master

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analytics dependencies
        run: pip install -r requirements-analytics.txt

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Build canonical company master from immutable SEC identifiers
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input out
          base="gdrive:01_RAW_IMMUTABLE/00_CONTROL_AND_CATALOG/company_master/SEC_IDENTIFIERS"
          rclone copyto "$base/company_tickers.json" input/company_tickers.json --stats 0
          rclone copyto "$base/company_tickers_exchange.json" input/company_tickers_exchange.json --stats 0

          python -m gmsdl.analytics.sec_company_master \
            --tickers input/company_tickers.json \
            --exchange input/company_tickers_exchange.json \
            --out-dir out

          rclone copyto out/COMPANY_MASTER.parquet \
            gdrive:03_RESEARCH/cross_domain/v1/COMPANY_MASTER/part-0000.parquet --stats 0
          rclone copyto out/CIK_TICKER_BRIDGE.parquet \
            gdrive:03_RESEARCH/cross_domain/v1/CIK_TICKER_BRIDGE/part-0000.parquet --stats 0
          rclone copyto out/company_master_manifest.json \
            gdrive:00_CONTROL/analytics/cross_domain/company_master_manifest.json --stats 0

          echo "Published COMPANY_MASTER and CIK_TICKER_BRIDGE."
          cat out/company_master_manifest.json
