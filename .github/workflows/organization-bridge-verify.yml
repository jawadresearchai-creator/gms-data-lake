name: Verify Cross-Domain Organization Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analytics dependencies
        run: pip install -r requirements-analytics.txt
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version
      - name: Stage bridge inputs and validate
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input report
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/ORGANIZATION_MASTER/part-0000.parquet input/ORGANIZATION_MASTER.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/SEC_OPENALEX_ORG_BRIDGE/part-0000.parquet input/SEC_OPENALEX_ORG_BRIDGE.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/SEC_OPENALEX_ORG_SCORED_CANDIDATES/part-0000.parquet input/SCORED_CANDIDATES.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/SEC_OPENALEX_ORG_REVIEW_QUEUE/part-0000.parquet input/REVIEW_QUEUE.parquet --stats 0
          python -m gmsdl.analytics.organization_bridge_validate \
            --organization-master input/ORGANIZATION_MASTER.parquet \
            --accepted-bridge input/SEC_OPENALEX_ORG_BRIDGE.parquet \
            --scored-candidates input/SCORED_CANDIDATES.parquet \
            --review-queue input/REVIEW_QUEUE.parquet \
            --output report/organization_bridge_validation.json
          rclone copyto report/organization_bridge_validation.json \
            gdrive:00_CONTROL/analytics/cross_domain/organization_bridge_validation.json --stats 0
          cat report/organization_bridge_validation.json
