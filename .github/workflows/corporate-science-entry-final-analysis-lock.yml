name: Corporate Science Entry Final Analysis Lock

on:
  push:
    branches:
      - research/corporate-science-entry-v1
    paths:
      - "tools/corporate_science_final_analysis_lock_v1.py"
      - "tools/corporate_science_final_analysis_lock_metadata_patch_v1.py"
      - ".github/workflows/corporate-science-entry-final-analysis-lock.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corporate-science-entry-final-analysis-lock-v1
  cancel-in-progress: false

jobs:
  final-analysis-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned analysis dependencies
        run: |
          pip install -r requirements-analytics.txt
          pip install pyfixest==0.60.0 pandas pyarrow scipy scikit-learn wildboottest==0.3.2

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Stage exact GMS marts and prior immutable checkpoints
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input
          rclone copyto gdrive:03_RESEARCH/openalex/v1/marts/WORK_YEAR_TOPIC/part-0000.parquet input/work_year_topic.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v10/COMPANY_TOPIC_YEAR/part-0000.parquet input/company_topic_year.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v10/COMPANY_COLLABORATION_YEAR/part-0000.parquet input/company_collaboration_year.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v10/COMPANY_RESEARCH_YEAR/part-0000.parquet input/company_research_year.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v10/COMPANY_CITATION_YEAR/part-0000.parquet input/company_citation_year.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/SEC_ISSUER_METADATA/part-0000.parquet input/sec_issuer_metadata.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/projects/corporate_science_entry_v1/01_design_freeze/run_34221681840/design_freeze.json input/design_freeze.json --stats 0
          rclone copyto gdrive:03_RESEARCH/projects/corporate_science_entry_v1/04_inference_hardening/run_34225440141/inference_hardening.json input/inference_hardening.json --stats 0
          rclone copyto gdrive:03_RESEARCH/projects/corporate_science_entry_v1/05_sensitivity_analysis/run_34228719850/sensitivity_summary.json input/sensitivity_summary.json --stats 0
          rclone copyto gdrive:03_RESEARCH/projects/corporate_science_entry_v1/05_sensitivity_analysis/run_34228719850/sensitivity_results.csv input/sensitivity_results.csv --stats 0
          sha256sum input/* | sort | tee input_sha256.txt

      - name: Complete H3 sensitivity-only estimation and build final lock
        run: python tools/corporate_science_final_analysis_lock_v1.py

      - name: Correct audit metadata
        run: python tools/corporate_science_final_analysis_lock_metadata_patch_v1.py

      - name: Attach input checksums
        run: cp input_sha256.txt output_final_lock/input_sha256.txt

      - name: Publish immutable final analysis lock to Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="gdrive:03_RESEARCH/projects/corporate_science_entry_v1/06_final_analysis_lock/run_${GITHUB_RUN_ID}"
          rclone copy output_final_lock "$TARGET" --stats 0
          printf '%s\n' "$TARGET"
          rclone lsf "$TARGET"

      - name: Upload final-lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: corporate-science-entry-final-lock-${{ github.run_id }}
          path: output_final_lock/
          retention-days: 30
