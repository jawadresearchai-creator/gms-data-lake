name: Build Complete SEC Company Master

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analytics dependencies
        run: pip install -r requirements-analytics.txt

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Stage SEC masters
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input out
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/COMPANY_MASTER/part-0000.parquet input/COMPANY_MASTER.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/FILING_MASTER/part-0000.parquet input/FILING_MASTER.parquet --stats 0

      - name: Build and publish complete company universe
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python -m gmsdl.analytics.sec_company_complete \
            --company-master input/COMPANY_MASTER.parquet \
            --filing-master input/FILING_MASTER.parquet \
            --out-dir out

          rclone copyto out/COMPANY_MASTER_COMPLETE.parquet \
            gdrive:03_RESEARCH/cross_domain/v1/COMPANY_MASTER_COMPLETE/part-0000.parquet --stats 0
          rclone copyto out/COMPANY_FILING_BRIDGE_COMPLETE.parquet \
            gdrive:03_RESEARCH/cross_domain/v1/COMPANY_FILING_BRIDGE_COMPLETE/part-0000.parquet --stats 0
          rclone copyto out/company_complete_manifest.json \
            gdrive:00_CONTROL/analytics/cross_domain/company_complete_manifest.json --stats 0

          cat out/company_complete_manifest.json
