name: Finalize Cross-Domain Organization Master

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analytics dependencies
        run: pip install -r requirements-analytics.txt

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Stage cross-domain inputs
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input out
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/COMPANY_MASTER_COMPLETE/part-0000.parquet input/COMPANY_MASTER_COMPLETE.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/SEC_OPENALEX_ORG_EXACT_BRIDGE/part-0000.parquet input/SEC_OPENALEX_ORG_EXACT_BRIDGE.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/SEC_OPENALEX_ORG_SCORED_ACCEPTED/part-0000.parquet input/SEC_OPENALEX_ORG_SCORED_ACCEPTED.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/SEC_OPENALEX_ORG_SCORED_CANDIDATES/part-0000.parquet input/SEC_OPENALEX_ORG_SCORED_CANDIDATES.parquet --stats 0

      - name: Finalize and publish organization master
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python -m gmsdl.analytics.organization_master_finalize \
            --company-master input/COMPANY_MASTER_COMPLETE.parquet \
            --exact-bridge input/SEC_OPENALEX_ORG_EXACT_BRIDGE.parquet \
            --scored-accepted input/SEC_OPENALEX_ORG_SCORED_ACCEPTED.parquet \
            --scored-candidates input/SEC_OPENALEX_ORG_SCORED_CANDIDATES.parquet \
            --out-dir out

          rclone copyto out/ORGANIZATION_MASTER.parquet \
            gdrive:03_RESEARCH/cross_domain/v1/ORGANIZATION_MASTER/part-0000.parquet --stats 0
          rclone copyto out/SEC_OPENALEX_ORG_BRIDGE.parquet \
            gdrive:03_RESEARCH/cross_domain/v1/SEC_OPENALEX_ORG_BRIDGE/part-0000.parquet --stats 0
          rclone copyto out/SEC_OPENALEX_ORG_REVIEW_QUEUE.parquet \
            gdrive:03_RESEARCH/cross_domain/v1/SEC_OPENALEX_ORG_REVIEW_QUEUE/part-0000.parquet --stats 0
          rclone copyto out/organization_master_manifest.json \
            gdrive:00_CONTROL/analytics/cross_domain/organization_master_manifest.json --stats 0

          cat out/organization_master_manifest.json
