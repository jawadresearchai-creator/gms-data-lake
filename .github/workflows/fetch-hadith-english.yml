name: Fetch English Hadith PDFs

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fetch-hadith-english.yml"

permissions:
  contents: read

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Download published English editions
        run: |
          set -euo pipefail
          mkdir -p books
          curl -fL --retry 5 --retry-all-errors \
            -o "books/03 - Sahih al-Bukhari (English - M. Muhsin Khan).pdf" \
            "https://d1.islamhouse.com/data/en/ih_books/single/en_Sahih_Al-Bukhari.pdf"
          curl -fL --retry 5 --retry-all-errors \
            -o "books/04 - Sahih Muslim (English - Abd-al-Hamid Siddiqui).pdf" \
            "https://d1.islamhouse.com/data/en/ih_books/single/en_Sahih_Muslim.pdf"
          ls -lh books
          sha256sum books/*.pdf

      - name: Upload to Facebook Page source folder
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: "1nl1fTFDYliyW0XYnA1udyZB4hCpwvSqA"
        run: |
          set -euo pipefail
          rclone copyto \
            "books/03 - Sahih al-Bukhari (English - M. Muhsin Khan).pdf" \
            'gdrive:03 - Sahih al-Bukhari (English - M. Muhsin Khan).pdf' \
            --retries 5 --low-level-retries 10 --checkers 4 --transfers 1
          rclone copyto \
            "books/04 - Sahih Muslim (English - Abd-al-Hamid Siddiqui).pdf" \
            'gdrive:04 - Sahih Muslim (English - Abd-al-Hamid Siddiqui).pdf' \
            --retries 5 --low-level-retries 10 --checkers 4 --transfers 1
          echo "Drive folder contents:"
          rclone lsl gdrive:
