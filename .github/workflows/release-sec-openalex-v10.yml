name: Freeze SEC+OpenAlex Production Release v10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analytics dependencies
        run: pip install -r requirements-analytics.txt
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version
      - name: Stage release inputs and inventory lake
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input out
          rclone lsjson gdrive: --recursive --files-only > input/drive_inventory.json
          rclone copyto gdrive:00_CONTROL/analytics/cross_domain/v10/company_work_marts_validation.json input/qa.json --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v10/SEC_OPENALEX_ORG_PRODUCTION_BRIDGE/part-0000.parquet input/ORG_BRIDGE.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v10/COMPANY_RESEARCH_YEAR/part-0000.parquet input/COMPANY_RESEARCH_YEAR.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v10/COMPANY_CITATION_YEAR/part-0000.parquet input/COMPANY_CITATION_YEAR.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v10/COMPANY_TOPIC_YEAR/part-0000.parquet input/COMPANY_TOPIC_YEAR.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v10/COMPANY_COLLABORATION_YEAR/part-0000.parquet input/COMPANY_COLLABORATION_YEAR.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/COMPANY_MASTER_COMPLETE/part-0000.parquet input/COMPANY_MASTER_COMPLETE.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/COMPANY_FILING_BRIDGE_COMPLETE/part-0000.parquet input/COMPANY_FILING_BRIDGE_COMPLETE.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/FILING_MASTER/part-0000.parquet input/FILING_MASTER.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/FILING_SECTION_BRIDGE/part-0000.parquet input/FILING_SECTION_BRIDGE.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/SEC_ISSUER_METADATA/part-0000.parquet input/SEC_ISSUER_METADATA.parquet --stats 0
      - name: Generate frozen release artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m gmsdl.analytics.release_finalize \
            --inventory-json input/drive_inventory.json \
            --qa-json input/qa.json \
            --dataset 'SEC_OPENALEX_ORG_PRODUCTION_BRIDGE=input/ORG_BRIDGE.parquet=03_RESEARCH/cross_domain/v10/SEC_OPENALEX_ORG_PRODUCTION_BRIDGE/part-0000.parquet' \
            --dataset 'COMPANY_RESEARCH_YEAR=input/COMPANY_RESEARCH_YEAR.parquet=03_RESEARCH/cross_domain/v10/COMPANY_RESEARCH_YEAR/part-0000.parquet' \
            --dataset 'COMPANY_CITATION_YEAR=input/COMPANY_CITATION_YEAR.parquet=03_RESEARCH/cross_domain/v10/COMPANY_CITATION_YEAR/part-0000.parquet' \
            --dataset 'COMPANY_TOPIC_YEAR=input/COMPANY_TOPIC_YEAR.parquet=03_RESEARCH/cross_domain/v10/COMPANY_TOPIC_YEAR/part-0000.parquet' \
            --dataset 'COMPANY_COLLABORATION_YEAR=input/COMPANY_COLLABORATION_YEAR.parquet=03_RESEARCH/cross_domain/v10/COMPANY_COLLABORATION_YEAR/part-0000.parquet' \
            --dataset 'COMPANY_MASTER_COMPLETE=input/COMPANY_MASTER_COMPLETE.parquet=03_RESEARCH/cross_domain/v1/COMPANY_MASTER_COMPLETE/part-0000.parquet' \
            --dataset 'COMPANY_FILING_BRIDGE_COMPLETE=input/COMPANY_FILING_BRIDGE_COMPLETE.parquet=03_RESEARCH/cross_domain/v1/COMPANY_FILING_BRIDGE_COMPLETE/part-0000.parquet' \
            --dataset 'FILING_MASTER=input/FILING_MASTER.parquet=03_RESEARCH/cross_domain/v1/FILING_MASTER/part-0000.parquet' \
            --dataset 'FILING_SECTION_BRIDGE=input/FILING_SECTION_BRIDGE.parquet=03_RESEARCH/cross_domain/v1/FILING_SECTION_BRIDGE/part-0000.parquet' \
            --dataset 'SEC_ISSUER_METADATA=input/SEC_ISSUER_METADATA.parquet=03_RESEARCH/cross_domain/v1/SEC_ISSUER_METADATA/part-0000.parquet' \
            --release-name sec_openalex_v10 \
            --out-dir out
          cat out/COMPLETION_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish frozen release
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          rclone copy out gdrive:00_CONTROL/releases/sec_openalex_v10 --stats 0
          rclone check out gdrive:00_CONTROL/releases/sec_openalex_v10 --size-only --one-way
          rclone lsf gdrive:00_CONTROL/releases/sec_openalex_v10
