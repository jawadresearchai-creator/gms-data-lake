name: Build Priority Organization Review Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analytics dependencies
        run: pip install -r requirements-analytics.txt
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version
      - name: Build priority review report
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input out
          rclone copyto gdrive:03_RESEARCH/cross_domain/v2/SEC_OPENALEX_ORG_GEO_RECLASSIFICATION/part-0000.parquet input/RECLASSIFICATION.parquet --stats 0
          python -m gmsdl.analytics.organization_priority_review \
            --reclassification input/RECLASSIFICATION.parquet \
            --out-dir out
          rclone copyto out/SEC_OPENALEX_ORG_PRIORITY_REVIEW.parquet gdrive:03_RESEARCH/cross_domain/v2/SEC_OPENALEX_ORG_PRIORITY_REVIEW/part-0000.parquet --stats 0
          rclone copyto out/SEC_OPENALEX_ORG_PRIORITY_REVIEW.csv gdrive:03_RESEARCH/cross_domain/v2/SEC_OPENALEX_ORG_PRIORITY_REVIEW/priority_review.csv --stats 0
          rclone copyto out/organization_priority_review.json gdrive:00_CONTROL/analytics/cross_domain/v2/organization_priority_review.json --stats 0
          cat out/organization_priority_review.json
