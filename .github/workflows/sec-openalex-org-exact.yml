name: Build Exact SEC OpenAlex Organization Bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install analytics dependencies
        run: pip install -r requirements-analytics.txt

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Stage SEC and OpenAlex institution masters
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input/institutions out
          rclone copyto \
            gdrive:03_RESEARCH/cross_domain/v1/COMPANY_MASTER_COMPLETE/part-0000.parquet \
            input/COMPANY_MASTER_COMPLETE.parquet --stats 0
          rclone copy \
            gdrive:02_CURATED/openalex/v1/INSTITUTION_MASTER \
            input/institutions --include '*.parquet' --stats 0
          echo "OpenAlex institution parquet files: $(find input/institutions -name '*.parquet' | wc -l)"
          du -sh input/institutions

      - name: Build and publish precision-first organization bridge
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python -m gmsdl.analytics.sec_openalex_org_exact \
            --company-master input/COMPANY_MASTER_COMPLETE.parquet \
            --institution-root input/institutions \
            --out-dir out

          rclone copyto out/SEC_OPENALEX_ORG_EXACT_CANDIDATES.parquet \
            gdrive:03_RESEARCH/cross_domain/v1/SEC_OPENALEX_ORG_EXACT_CANDIDATES/part-0000.parquet --stats 0
          rclone copyto out/SEC_OPENALEX_ORG_EXACT_BRIDGE.parquet \
            gdrive:03_RESEARCH/cross_domain/v1/SEC_OPENALEX_ORG_EXACT_BRIDGE/part-0000.parquet --stats 0
          rclone copyto out/sec_openalex_org_exact_manifest.json \
            gdrive:00_CONTROL/analytics/cross_domain/sec_openalex_org_exact_manifest.json --stats 0

          cat out/sec_openalex_org_exact_manifest.json
