name: Verify SEC OpenAlex Company Work Marts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analytics dependencies
        run: pip install -r requirements-analytics.txt
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version
      - name: Stage v2 marts and validate
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input report
          rclone copyto gdrive:03_RESEARCH/cross_domain/v2/SEC_OPENALEX_ORG_PRODUCTION_BRIDGE/part-0000.parquet input/PRODUCTION_BRIDGE.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v2/COMPANY_RESEARCH_YEAR/part-0000.parquet input/COMPANY_RESEARCH_YEAR.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v2/COMPANY_TOPIC_YEAR/part-0000.parquet input/COMPANY_TOPIC_YEAR.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/cross_domain/v2/COMPANY_COLLABORATION_YEAR/part-0000.parquet input/COMPANY_COLLABORATION_YEAR.parquet --stats 0
          python -m gmsdl.analytics.company_work_marts_validate \
            --production-bridge input/PRODUCTION_BRIDGE.parquet \
            --company-research-year input/COMPANY_RESEARCH_YEAR.parquet \
            --company-topic-year input/COMPANY_TOPIC_YEAR.parquet \
            --company-collaboration-year input/COMPANY_COLLABORATION_YEAR.parquet \
            --output report/company_work_marts_validation.json
          rclone copyto report/company_work_marts_validation.json \
            gdrive:00_CONTROL/analytics/cross_domain/v2/company_work_marts_validation.json --stats 0
          cat report/company_work_marts_validation.json
