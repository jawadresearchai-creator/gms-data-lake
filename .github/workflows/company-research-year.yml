name: Build SEC OpenAlex Company Research Year Marts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analytics dependencies
        run: pip install -r requirements-analytics.txt
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version
      - name: Stage accepted organization master and institution-year mart
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input out
          rclone copyto gdrive:03_RESEARCH/cross_domain/v1/ORGANIZATION_MASTER/part-0000.parquet input/ORGANIZATION_MASTER.parquet --stats 0
          rclone copyto gdrive:03_RESEARCH/openalex/v1/marts/WORK_YEAR_INSTITUTION/part-0000.parquet input/WORK_YEAR_INSTITUTION.parquet --stats 0
      - name: Build and publish company-year marts
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python -m gmsdl.analytics.company_research_year \
            --organization-master input/ORGANIZATION_MASTER.parquet \
            --work-year-institution input/WORK_YEAR_INSTITUTION.parquet \
            --out-dir out
          rclone copyto out/COMPANY_RESEARCH_YEAR.parquet gdrive:03_RESEARCH/cross_domain/v1/COMPANY_RESEARCH_YEAR/part-0000.parquet --stats 0
          rclone copyto out/COMPANY_CITATION_YEAR.parquet gdrive:03_RESEARCH/cross_domain/v1/COMPANY_CITATION_YEAR/part-0000.parquet --stats 0
          rclone copyto out/company_research_year_manifest.json gdrive:00_CONTROL/analytics/cross_domain/company_research_year_manifest.json --stats 0
          cat out/company_research_year_manifest.json
