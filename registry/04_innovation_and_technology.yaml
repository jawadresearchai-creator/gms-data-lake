domain: "04_INNOVATION_AND_TECHNOLOGY"
sources:
  - id: GOOGLE_PATENTS_PUBLIC
    name: Google Patents Public Data on BigQuery
    subdomain: patents
    kind: adapter
    adapter: bigquery_public
    cadence: quarterly
    tier: massive
    enabled: false
    homepage: https://console.cloud.google.com/bigquery?p=patents-public-data&d=patents&page=dataset
    license: CC BY 4.0 (IFI CLAIMS Patent Services and Google)
    notes: >
      Primary patent-data replacement for the ID.me-gated USPTO/PatentsView path.
      Worldwide bibliographic data with US full text. Managed by the dedicated
      google-patents.yml workflow rather than the generic URL ingestion engine;
      disabled here so routine runs cannot accidentally invoke BigQuery or incur
      query charges. Every execution must pass a BigQuery dry-run byte cap.
    params:
      table: patents-public-data.patents.publications
      primary_country: US
      dedicated_workflow: google-patents.yml

  - id: EPO_OPS
    name: EPO Open Patent Services
    subdomain: patents
    kind: adapter
    adapter: external_validation
    cadence: quarterly
    tier: extended
    enabled: false
    homepage: https://www.epo.org/en/searching-for-patents/data/web-services/ops
    license: EPO OPS terms and fair-use charter
    notes: >
      Independent authoritative validation/enrichment source. Free usage is
      limited to 4 GB per calendar week and requires EPO registration/OAuth, so
      it is intentionally not used for full-lake bulk acquisition.
    params:
      role: validation_enrichment
      free_weekly_bytes: 4294967296

  - id: USPTO_ODP
    enabled: false
    name: USPTO Open Data Portal bulk products
    subdomain: patents
    kind: static
    cadence: monthly
    tier: extended
    homepage: https://data.uspto.gov/bulkdata
    license: US federal government work, public domain
    notes: >
      bulkdata.uspto.gov was retired and the old PatentsView download pages now
      redirect to data.uspto.gov. Endpoints below are the current portal's;
      Optional authoritative source; currently blocked by USPTO account/identity access.
      Keep disabled until valid ODP access exists; it must not block the patent domain.
    datasets:
      - id: patent_grant_index
        url: https://bulkdata.uspto.gov/data/patent/grant/redbook/fulltext/2025/
        filename: patent_grant_index.html
        params: {expect_html: true}
        notes: Index page only â€” used to detect whether the legacy host still resolves.

  - id: PATENTSVIEW
    enabled: false
    name: PatentsView research-ready patent tables
    subdomain: patents
    kind: adapter
    adapter: static_expand
    cadence: quarterly
    tier: bulk
    homepage: https://patentsview.org/
    license: CC BY 4.0
    notes: >
      Optional legacy/research source. Current distribution is tied to USPTO ODP
      access; disabled so it cannot block Google Patents primary ingestion.
    params:
      url_template: "https://s3.amazonaws.com/data.patentsview.org/download/{code}.tsv.zip"
      filename_template: "{code}.tsv.zip"
      doctor_sample: 4
      codes:
        - g_patent
        - g_assignee_disambiguated
        - g_inventor_disambiguated
        - g_cpc_current
        - g_us_patent_citation
        - g_location_disambiguated
        - g_application

  - id: CROSSREF
    name: Crossref works metadata
    subdomain: scientific_publications
    kind: static
    cadence: monthly
    tier: core
    homepage: https://api.crossref.org/
    license: CC0
    rate_limit_per_sec: 5
    datasets:
      - id: crossref_members
        url: https://api.crossref.org/members?rows=1000
        filename: crossref_members.json
      - id: crossref_journals
        url: https://api.crossref.org/journals?rows=1000
        filename: crossref_journals.json

  - id: OPENALEX_SNAPSHOT
    name: OpenAlex scholarly graph snapshot
    subdomain: scientific_publications
    kind: adapter
    adapter: s3_public
    cadence: quarterly
    tier: massive
    homepage: https://docs.openalex.org/download-all-data/openalex-snapshot
    license: CC0
    notes: >
      Full Parquet snapshot. Registered at tier `massive` so no scheduled run touches it.
      Backfill in resumable S3 key-range batches; routine runs remain unaffected.
    params:
      host: openalex.s3.amazonaws.com
      prefix: "data/parquet/"
      max_keys: 100000
      max_total_bytes: 85899345920
      doctor_sample: 2

  - id: WIPO_STATISTICS
    name: WIPO IP statistics data centre
    subdomain: innovation_indicators
    kind: static
    cadence: annual
    tier: extended
    homepage: https://www.wipo.int/ipstats/
    license: WIPO terms â€” free for research
    datasets:
      - id: wipo_ip_statistics
        url: https://ourworldindata.org/grapher/annual-patent-applications.csv?v=1&csvType=full
        filename: wipo_annual_patent_applications_owid.csv
        notes: OWID mirror of WIPO patent-application series via World Bank; used because the old WIPO bulk path now serves HTML.
