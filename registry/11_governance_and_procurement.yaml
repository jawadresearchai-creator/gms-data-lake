domain: "11_GOVERNANCE_REGULATION_AND_PROCUREMENT"
sources:
  - id: FEDERAL_REGISTER_BULK
    name: Federal Register bulk XML via govinfo
    subdomain: regulations
    kind: adapter
    adapter: federal_register
    cadence: monthly
    tier: extended
    homepage: https://www.govinfo.gov/bulkdata/FR
    license: US federal government work, public domain
    params:
      start_year: 2015
      end_year: 2026
      doctor_sample: 3

  - id: FEDERAL_REGISTER_API
    name: Federal Register documents API
    subdomain: regulatory_events
    kind: static
    cadence: weekly
    tier: core
    homepage: https://www.federalregister.gov/developers/documentation/api/v1
    license: US federal government work, public domain
    datasets:
      - id: recent_rules
        url: https://www.federalregister.gov/api/v1/documents.json?per_page=1000&order=newest&conditions[type][]=RULE
        filename: federal_register_rules.json
      - id: agencies
        url: https://www.federalregister.gov/api/v1/agencies.json
        filename: federal_register_agencies.json

  - id: WORLD_BANK_GOVERNANCE
    name: Worldwide Governance Indicators
    subdomain: governance_indicators
    kind: static
    cadence: annual
    tier: core
    homepage: https://www.worldbank.org/en/publication/worldwide-governance-indicators
    license: CC BY 4.0
    datasets:
      - id: wgi_excel
        url: https://www.worldbank.org/content/dam/sites/govindicators/doc/wgidataset.xlsx
        filename: wgi_dataset.xlsx

  - id: USASPENDING_ARCHIVE
    name: USAspending award data archive
    subdomain: contracts
    kind: static
    cadence: monthly
    tier: extended
    homepage: https://www.usaspending.gov/download_center/award_data_archive
    license: US federal government work, public domain
    notes: >
      Archive filenames embed a build date, so a static URL goes stale monthly.
      The API endpoints below are stable and are the better default.
    datasets:
      - id: agency_list
        url: https://api.usaspending.gov/api/v2/references/toptier_agencies/
        filename: usaspending_agencies.json
      - id: federal_accounts
        url: https://api.usaspending.gov/api/v2/federal_accounts/
        filename: usaspending_federal_accounts.json

  - id: EU_TED_PROCUREMENT
    name: EU Tenders Electronic Daily
    subdomain: tenders
    kind: static
    cadence: monthly
    tier: extended
    homepage: https://data.europa.eu/data/datasets?query=TED
    license: EU open data — free reuse
    datasets:
      - id: ted_csv_2024
        url: https://data.europa.eu/api/hub/search/datasets/ted-csv
        filename: ted_csv_metadata.json
        notes: Metadata endpoint; the yearly CSV links are inside the response.
